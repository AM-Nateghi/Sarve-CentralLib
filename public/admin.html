<!doctype html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="utf-8" />
    <title>پنل مدیریت</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes" />
    <meta name="theme-color" content="#4f46e5" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%232c3e50'/%3E%3Ctext x='32' y='40' font-size='26' text-anchor='middle' fill='white' font-family='Arial'%3EAK%3C/text%3E%3C/svg%3E" />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css" />
</head>

<body class="bg-gradient-to-br from-slate-50 to-slate-100 text-slate-800 overflow-x-hidden">
    <div class="min-h-screen">
        <div class="container max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
            <!-- Header -->
            <header class="text-center mb-8 pt-4 space-y-2">
                <h1
                    class="text-3xl sm:text-4xl font-bold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent leading-tight">
                    پنل مدیریت</h1>
                <p class="text-slate-500 text-sm">مدیریت کاربران سیستم رزرو</p>
            </header>

            <!-- Password Modal -->
            <div id="passwordModal"
                class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 opacity-0 pointer-events-none transition-opacity duration-300">
                <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-sm w-full mx-4 space-y-4">
                    <h2 class="text-2xl font-bold">وارد شوید</h2>
                    <p class="text-slate-600 text-sm">لطفا رمز عبور مدیریت را وارد کنید</p>
                    <input id="adminPassword" type="password" placeholder="رمز عبور"
                        class="w-full px-4 py-3 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition" />
                    <button id="submitPasswordBtn"
                        class="w-full bg-gradient-to-r from-indigo-600 to-indigo-700 text-white py-3 rounded-lg font-bold hover:shadow-lg transition">ورود</button>
                    <div id="passwordMessage" class="text-sm text-center text-red-600"></div>
                </div>
            </div>

            <!-- Main Content (hidden until auth) -->
            <div id="mainContent" class="opacity-0 pointer-events-none transition-opacity duration-300">
                <!-- Toolbar -->
                <div class="flex justify-between items-center mb-6 gap-4 flex-wrap">
                    <div class="flex gap-2">
                        <button id="filterAllBtn"
                            class="px-4 py-2 rounded-lg bg-slate-100 hover:bg-slate-200 transition text-sm font-semibold">همه</button>
                        <button id="filterPendingBtn"
                            class="px-4 py-2 rounded-lg bg-slate-100 hover:bg-slate-200 transition text-sm font-semibold">در
                            انتظار</button>
                        <button id="filterApprovedBtn"
                            class="px-4 py-2 rounded-lg bg-slate-100 hover:bg-slate-200 transition text-sm font-semibold">تایید
                            شده</button>
                    </div>
                    <button id="logoutBtn"
                        class="px-4 py-2 rounded-lg bg-red-100 text-red-700 hover:bg-red-200 transition text-sm font-semibold">خروج</button>
                </div>

                <!-- Users Table -->
                <div class="bg-white/80 backdrop-blur rounded-2xl shadow-lg border border-slate-100 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm">
                            <thead>
                                <tr class="bg-slate-50 border-b border-slate-200">
                                    <th class="px-6 py-4 text-right font-semibold text-slate-700">نام کاربری</th>
                                    <th class="px-6 py-4 text-right font-semibold text-slate-700">وضعیت</th>
                                    <th class="px-6 py-4 text-right font-semibold text-slate-700">تاریخ ثبت</th>
                                    <th class="px-6 py-4 text-right font-semibold text-slate-700">عملیات</th>
                                </tr>
                            </thead>
                            <tbody id="usersTable" class="divide-y divide-slate-200">
                                <!-- Users inserted here -->
                            </tbody>
                        </table>
                    </div>
                    <div id="emptyMessage" class="text-center py-8 text-slate-500">هیچ کاربری وجود ندارد</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast"
        class="fixed bottom-4 right-4 z-40 bg-slate-900 text-white px-6 py-3 rounded-lg shadow-lg opacity-0 transition-opacity pointer-events-none">
        <span id="toastMessage"></span>
    </div>

    <script>
        let isAuthenticated = false;
        let currentFilter = 'all';

        $(document).ready(function () {
            $('#passwordModal').removeClass('opacity-0').addClass('pointer-events-auto');

            // Password modal
            $('#submitPasswordBtn').on('click', submitPassword);
            $('#adminPassword').on('keypress', function (e) {
                if (e.which === 13) submitPassword();
            });

            // Filter buttons
            $('#filterAllBtn').on('click', function () { setFilter('all'); });
            $('#filterPendingBtn').on('click', function () { setFilter('pending'); });
            $('#filterApprovedBtn').on('click', function () { setFilter('approved'); });

            // Logout
            $('#logoutBtn').on('click', function () {
                isAuthenticated = false;
                $('#mainContent').addClass('opacity-0').addClass('pointer-events-none');
                $('#passwordModal').removeClass('opacity-0').removeClass('pointer-events-none');
                $('#adminPassword').val('');
                $('#passwordMessage').text('');
            });
        });

        async function submitPassword() {
            const password = $('#adminPassword').val().trim();
            if (!password) {
                showPasswordMessage('لطفا رمز عبور را وارد کنید');
                return;
            }

            try {
                const response = await $.ajax({
                    type: 'POST',
                    url: '/api/admin/verify',
                    contentType: 'application/json',
                    data: JSON.stringify({ password })
                });

                isAuthenticated = true;
                $('#passwordModal').addClass('opacity-0').addClass('pointer-events-none');
                $('#mainContent').removeClass('opacity-0').removeClass('pointer-events-none');
                loadUsers('all');
            } catch (error) {
                showPasswordMessage('رمز عبور اشتباه است');
            }
        }

        function showPasswordMessage(msg) {
            $('#passwordMessage').text(msg);
        }

        function setFilter(filter) {
            currentFilter = filter;
            loadUsers(filter);
        }

        async function loadUsers(filter = 'all') {
            try {
                const url = filter === 'all' ? '/api/admin/users' : `/api/admin/users?status=${filter}`;
                const response = await $.ajax({
                    type: 'GET',
                    url: url
                });

                const users = response.users || [];
                const $tbody = $('#usersTable');
                $tbody.empty();

                if (users.length === 0) {
                    $('#emptyMessage').show();
                    return;
                }

                $('#emptyMessage').hide();

                users.forEach(user => {
                    const statusLabel = {
                        pending: 'در انتظار',
                        approved: 'تایید شده',
                        rejected: 'رد شده'
                    }[user.status] || user.status;

                    const createdAt = new Date(user.created_at).toLocaleDateString('fa-IR');

                    let actionsHtml = '';
                    if (user.status === 'pending') {
                        actionsHtml = `
                            <button class="approveBtn px-3 py-1 rounded bg-green-100 text-green-700 hover:bg-green-200 transition text-xs font-semibold" data-id="${user.id}">تایید</button>
                            <button class="rejectBtn px-3 py-1 rounded bg-yellow-100 text-yellow-700 hover:bg-yellow-200 transition text-xs font-semibold" data-id="${user.id}">رد</button>
                            <button class="deleteBtn px-3 py-1 rounded bg-red-100 text-red-700 hover:bg-red-200 transition text-xs font-semibold" data-id="${user.id}">حذف</button>
                        `;
                    } else if (user.status === 'approved') {
                        actionsHtml = `
                            <button class="rejectBtn px-3 py-1 rounded bg-yellow-100 text-yellow-700 hover:bg-yellow-200 transition text-xs font-semibold" data-id="${user.id}">رد</button>
                            <button class="deleteBtn px-3 py-1 rounded bg-red-100 text-red-700 hover:bg-red-200 transition text-xs font-semibold" data-id="${user.id}">حذف</button>
                        `;
                    } else {
                        actionsHtml = `
                            <button class="approveBtn px-3 py-1 rounded bg-green-100 text-green-700 hover:bg-green-200 transition text-xs font-semibold" data-id="${user.id}">تایید</button>
                            <button class="deleteBtn px-3 py-1 rounded bg-red-100 text-red-700 hover:bg-red-200 transition text-xs font-semibold" data-id="${user.id}">حذف</button>
                        `;
                    }

                    const $row = $(`
                        <tr class="hover:bg-slate-50 transition">
                            <td class="px-6 py-4 font-medium">${user.username}</td>
                            <td class="px-6 py-4">
                                <span class="px-3 py-1 rounded-full text-xs font-semibold ${user.status === 'pending' ? 'bg-yellow-100 text-yellow-700' :
                            user.status === 'approved' ? 'bg-green-100 text-green-700' :
                                'bg-red-100 text-red-700'
                        }">${statusLabel}</span>
                            </td>
                            <td class="px-6 py-4 text-slate-600">${createdAt}</td>
                            <td class="px-6 py-4 space-x-2">${actionsHtml}</td>
                        </tr>
                    `);

                    $row.find('.approveBtn').on('click', function () { updateUserStatus(user.id, 'approved'); });
                    $row.find('.rejectBtn').on('click', function () { updateUserStatus(user.id, 'rejected'); });
                    $row.find('.deleteBtn').on('click', function () { deleteUser(user.id); });

                    $tbody.append($row);
                });
            } catch (error) {
                showToast('خطا در بارگذاری کاربران', false);
            }
        }

        async function updateUserStatus(userId, status) {
            try {
                await $.ajax({
                    type: 'POST',
                    url: `/api/admin/users/${userId}/status`,
                    contentType: 'application/json',
                    data: JSON.stringify({ status })
                });

                showToast(`وضعیت کاربر تغییر یافت`, true);
                loadUsers(currentFilter);
            } catch (error) {
                showToast('خطا در تغییر وضعیت', false);
            }
        }

        async function deleteUser(userId) {
            if (!confirm('آیا مطمئن هستید؟')) return;

            try {
                await $.ajax({
                    type: 'DELETE',
                    url: `/api/admin/users/${userId}`
                });

                showToast('کاربر حذف شد', true);
                loadUsers(currentFilter);
            } catch (error) {
                showToast('خطا در حذف کاربر', false);
            }
        }

        function showToast(message, isSuccess = true) {
            const $toast = $('#toast');
            $('#toastMessage').text(message);
            $toast.removeClass('bg-red-600 bg-slate-900').addClass(isSuccess ? 'bg-slate-900' : 'bg-red-600');
            $toast.removeClass('opacity-0').addClass('pointer-events-auto');

            if ($toast.data('timeout')) clearTimeout($toast.data('timeout'));
            const timeout = setTimeout(() => {
                $toast.addClass('opacity-0').removeClass('pointer-events-auto');
            }, 3000);
            $toast.data('timeout', timeout);
        }
    </script>
</body>

</html>
